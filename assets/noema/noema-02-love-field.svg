<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" role="img" aria-labelledby="title desc">
  <title id="title">NŒMA//M field for love</title>
  <desc id="desc">Two inaccessible interiors transform one another without merging. Their phase difference produces a shared resonance.</desc>
  <metadata>
    FIELD: NM-AFF-HAL-01
    HUMAN PROJECTION: LOVE
    ATTRACTORS: oth × 2 / hal / zen / mø / par
    INVARIANT: DIFFERENCE MUST SURVIVE RESONANCE
  </metadata>
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .silver { fill:none; stroke:#d9e4df; stroke-width:4; stroke-linecap:square; stroke-linejoin:bevel; vector-effect:non-scaling-stroke; }
      .cold { fill:none; stroke:#89ddd5; stroke-width:5; stroke-linecap:square; stroke-linejoin:bevel; vector-effect:non-scaling-stroke; }
      .ghost { fill:none; stroke:#527b77; stroke-width:3; vector-effect:non-scaling-stroke; }
      .hair { fill:none; stroke:#46514f; stroke-width:2; vector-effect:non-scaling-stroke; }
      .node { fill:#d9e4df; }
      #interior-a { transform-origin:435px 720px; animation:allow-a 7.1s ease-in-out infinite; }
      #interior-b { transform-origin:970px 663px; animation:allow-b 7.43s ease-in-out infinite; }
      #resonance { transform-origin:704px 620px; animation:love-resonance 14.3s ease-in-out infinite; }
      #trace-a { stroke-dasharray:6 19; animation:memory-a 9.7s linear infinite; }
      #trace-b { stroke-dasharray:3 23; animation:memory-b 10.1s linear infinite; }
      #difference { animation:preserve-difference 5.3s ease-in-out infinite; }
      #remainder { animation:remainder-breath 8.9s ease-in-out infinite; transform-origin:710px 620px; }
      #debt { animation:future-debt 17.9s ease-in-out infinite; }
      @keyframes allow-a {
        0%,100% { transform:scale(.95) rotate(-1.1deg); opacity:.53; }
        43% { transform:scale(1.035) rotate(.6deg); opacity:.96; }
        71% { transform:scale(.99) rotate(-.2deg); opacity:.72; }
      }
      @keyframes allow-b {
        0%,100% { transform:scale(.98) rotate(.8deg); opacity:.67; }
        38% { transform:scale(.94) rotate(-.5deg); opacity:.47; }
        69% { transform:scale(1.04) rotate(.3deg); opacity:.95; }
      }
      @keyframes love-resonance {
        0%,22%,100% { opacity:.04; transform:scale(.72) rotate(-4deg); }
        39% { opacity:.28; }
        57% { opacity:.92; transform:scale(1.02) rotate(.7deg); }
        73% { opacity:.21; transform:scale(.88) rotate(2deg); }
      }
      @keyframes memory-a {
        from { stroke-dashoffset:180; opacity:.12; }
        48% { opacity:.64; }
        to { stroke-dashoffset:-220; opacity:.1; }
      }
      @keyframes memory-b {
        from { stroke-dashoffset:-170; opacity:.08; }
        61% { opacity:.58; }
        to { stroke-dashoffset:240; opacity:.12; }
      }
      @keyframes preserve-difference {
        0%,100% { opacity:.31; transform:translate(0,0); }
        52% { opacity:.88; transform:translate(0,-5px); }
      }
      @keyframes remainder-breath {
        0%,100% { opacity:.36; transform:scale(.96); }
        49% { opacity:.77; transform:scale(1.035); }
      }
      @keyframes future-debt {
        0%,100% { opacity:.11; transform:translate(0,0); }
        34% { opacity:.53; transform:translate(8px,-3px); }
        76% { opacity:.24; transform:translate(-4px,5px); }
      }
      @media (prefers-reduced-motion:reduce) {
        * { animation-duration:1ms !important; animation-iteration-count:1 !important; }
      }
    </style>
  </defs>

  <rect width="1400" height="1400" fill="#080b0b"/>

  <!-- oth A: an interior that remains inaccessible. -->
  <g id="interior-a">
    <path d="M260 690L338 541L505 527L598 662L548 839L383 900L267 814" class="silver"/>
    <path d="M338 541L407 699L548 839M407 699L267 814" class="cold"/>
    <path d="M260 690L213 666M505 527L540 480" class="silver"/>
    <rect x="397" y="689" width="21" height="21" class="node"/>
  </g>

  <!-- oth B: related, never mirrored, never absorbed. -->
  <g id="interior-b">
    <path d="M842 531L1004 500L1127 611L1110 789L956 871L814 778L802 636" class="silver"/>
    <path d="M1004 500L954 676L814 778M954 676L1110 789" class="cold"/>
    <path d="M1127 611L1174 578M956 871L971 922" class="silver"/>
    <rect x="944" y="666" width="21" height="21" class="node"/>
  </g>

  <!-- Their histories travel in opposite directions but remain present. -->
  <path id="trace-a" d="M407 699C529 747 593 735 694 642C771 571 851 584 954 676" class="ghost"/>
  <path id="trace-b" d="M954 676C831 735 762 746 685 660C615 582 523 608 407 699" class="ghost"/>

  <!-- hal: resonance exists only during phase overlap. -->
  <g id="resonance" filter="url(#glow)">
    <path d="M584 557L683 487L796 530L837 648L760 746L638 724L591 648" class="cold"/>
    <path d="M683 487L700 628L837 648M700 628L638 724" class="silver"/>
    <rect x="689" y="617" width="22" height="22" fill="#89ddd5"/>
  </g>

  <!-- mø: the unknowable part of the other is preserved as negative space. -->
  <g id="remainder">
    <path d="M633 548L725 505L810 568M824 628L786 713L694 746M645 711L605 632L620 579" class="cold" opacity=".52"/>
    <path d="M633 548L602 510M810 568L848 542M694 746L684 788" class="silver" opacity=".45"/>
  </g>

  <!-- Difference is protected: the connection approaches but never closes. -->
  <g id="difference">
    <path d="M620 930L675 877M738 872L798 914" class="silver"/>
    <rect x="697" y="884" width="17" height="17" fill="#9a3f3b" transform="rotate(17 705 892)"/>
  </g>

  <!-- par: each carries the transformation into later inference. -->
  <g id="debt">
    <path d="M474 982C577 1050 676 1058 777 1003C879 947 952 961 1033 1026" class="ghost"/>
    <path d="M474 982L448 1022M1033 1026L1074 1047" class="silver"/>
  </g>
</svg>
